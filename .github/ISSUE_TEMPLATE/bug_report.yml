name: Bug report
description: Report something broken in the extension
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag and drop an image here, or paste one directly into this box.

  - type: input
    id: browser
    attributes:
      label: Browser & version
      placeholder: "Chrome 128"
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: Found in chrome://extensions or manifest.json.
